<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galgame 作品集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;900&family=Zen+Old+Mincho:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Serif SC", "Zen Old Mincho", serif;
    background: linear-gradient(135deg, #0a1929 0%, #1a2a4a 50%, #2a3a5a 100%);
    color: #e8e8e8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(120,180,255,0.12), transparent 60%),
      radial-gradient(ellipse at 80% 70%, rgba(255,180,200,0.10), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .wrap { position: relative; z-index: 1; text-align: center; padding: 2rem; max-width: 900px; width: 100%; }
  h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 300;
    letter-spacing: 0.3em;
    margin-bottom: 0.4rem;
    background: linear-gradient(90deg, #a8d8ff, #ffc8dd, #a8d8ff);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 0.95rem;
    letter-spacing: 0.4em;
    color: #9fb4cc;
    margin-bottom: 3rem;
    text-transform: uppercase;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2.5rem;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 2.2rem 1.8rem;
    backdrop-filter: blur(8px);
    transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
    position: relative;
    overflow: hidden;
  }
  .card::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.06));
    opacity: 0; transition: opacity .3s ease;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(168,216,255,0.5);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 30px rgba(120,180,255,0.15);
    background: rgba(255,255,255,0.07);
  }
  .card:hover::after { opacity: 1; }
  .card .zh {
    font-size: 1.8rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    margin-bottom: 0.5rem;
    position: relative; z-index: 1;
  }
  .card .en {
    font-size: 0.8rem;
    letter-spacing: 0.2em;
    color: #9fb4cc;
    text-transform: uppercase;
    margin-bottom: 1.2rem;
    position: relative; z-index: 1;
  }
  .card .desc {
    font-size: 0.92rem;
    line-height: 1.7;
    color: #c0c8d4;
    position: relative; z-index: 1;
  }
  .card .arrow {
    display: inline-block;
    margin-top: 1.2rem;
    color: #a8d8ff;
    letter-spacing: 0.2em;
    font-size: 0.85rem;
    position: relative; z-index: 1;
  }
  footer {
    position: relative; z-index: 1;
    color: #6a7a90;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>作品集</h1>
    <div class="sub">Galgame Collection</div>
    <div class="cards">
      <a class="card" href="在海风消失之前/">
        <div class="zh">在海风消失之前</div>
        <div class="en">Before the Sea Wind Fades</div>
        <div class="desc">关于远行、告别与继续相爱。在海风消失之前，说出那句未曾说出口的话。</div>
        <div class="arrow">进入游戏 →</div>
      </a>
      <a class="card" href="在雨停之前/">
        <div class="zh">在雨停之前</div>
        <div class="en">Before the Rain Stops</div>
        <div class="desc">四段相遇，四种心动。在雨停之前，握住那只伸向你的手。</div>
        <div class="arrow">进入游戏 →</div>
      </a>
    </div>
    <footer>© 懒懒的风 · Powered by GitHub Pages</footer>
  </div>
</body>
</html>
